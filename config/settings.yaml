# Kraken Bot - Configuración Central
# Este archivo contiene todos los parámetros del sistema

# Configuración del Exchange
exchange:
  name: "kraken"
  # Pares de trading a monitorear (formato: BASE/QUOTE)
  symbols:
    - "BTC/USD"
    - "ETH/USD"
  # Timeframe de las velas (1m, 5m, 15m, 30m, 1h, 4h, 1d)
  timeframe: "30m"
  # Número de velas a descargar en cada consulta
  limit: 100

# Configuración de Base de Datos
database:
  # Path de la base de datos SQLite
  path: "data/ohlcv.db"
  # Nombre de la tabla principal
  table: "ohlcv"

# Configuración de Logging
logging:
  # Nivel de logging (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: "INFO"
  # Formato de los mensajes
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  # Formato de fecha/hora
  date_format: "%Y-%m-%d %H:%M:%S"
  # Archivo de log
  file: "logs/bot.log"
  # Tamaño máximo del archivo de log (en bytes, 10MB)
  max_bytes: 10485760
  # Número de archivos de backup
  backup_count: 5
  # Mostrar logs en consola también
  console: true

# Configuración de Indicadores (para uso futuro)
indicators:
  rsi:
    period: 14
    overbought: 70
    oversold: 30

# Configuración de Scheduler (modo continuo)
scheduler:
  # Intervalo entre ciclos en segundos (300 = 5 minutos)
  interval: 300
  # Número máximo de reintentos en caso de error
  max_retries: 3
  # Delay entre reintentos en segundos
  retry_delay: 60

# Configuración de Alertas (para uso futuro)
alerts:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

# Configuración de Predicciones
predictions:
  # Activar/desactivar capa predictiva
  enabled: true
  # Horizonte temporal por defecto (next_1_candle, next_3_candles, next_5_candles)
  default_horizon: "next_3_candles"
  # Umbral mínimo de confianza para considerar la predicción
  min_confidence: 0.5
  # Pesos de cada señal técnica (deben sumar 1.0)
  weights:
    rsi_signal: 0.35
    rsi_momentum: 0.20
    price_momentum: 0.25
    volume_trend: 0.20

  # Thresholds operativos (PASO 2)
  thresholds:
    low: 0.55 # confidence < 0.55 = LOW
    medium: 0.65 # 0.55 <= confidence < 0.65 = MEDIUM
    high: 0.65 # confidence >= 0.65 = HIGH

  # Confirmación multi-timeframe (PASO 3)
  multi_timeframe:
    enabled: false # Se activará en PASO 3
    timeframes: ["15m", "1h"]
    confidence_boost: 0.05 # Aumento si confirma
    confidence_penalty: 0.05 # Reducción si contradice

  # Reglas de no-predicción (PASO 4)
  no_prediction:
    enabled: false # Se activará en PASO 4
    rules:
      low_momentum_threshold: 0.005 # |price_change| < 0.5%
      low_volume_percentile: 0.20 # Volumen bajo percentil 20
      min_confidence_absolute: 0.52 # Mínimo absoluto

# Configuración de Backtesting (PASO 1)
backtesting:
  enabled: true
  db_path: "data/backtesting.db"
  json_path: "data/backtesting.json"
  # Verificar predicciones automáticamente en cada ciclo
  auto_verify: true
  # Threshold para considerar movimiento (0.1% por defecto)
  movement_threshold: 0.001
